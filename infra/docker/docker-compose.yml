version: '3.8'

name: complyos

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: complyos
      POSTGRES_USER: complyos
      POSTGRES_PASSWORD: complyos_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complyos"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: 
      context: ./apps/auth-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://complyos:complyos_dev_password@postgres:5432/complyos
      - JWT_SECRET=complyos-jwt-secret-dev-change-in-production
      - JWT_EXPIRES_IN=15m
      - PORT=3001
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/auth-service:/workspace/project

  business-service:
    build:
      context: ./apps/business-service
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://complyos:complyos_dev_password@postgres:5432/complyos
      - PORT=3002
    depends_on:
      postgres:
        condition: service_healthy

  gst-service:
    build:
      context: ./apps/gst-service
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://complyos:complyos_dev_password@postgres:5432/complyos
      - PORT=3003
    depends_on:
      postgres:
        condition: service_healthy

  vendor-service:
    build:
      context: ./apps/vendor-service
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://complyos:complyos_dev_password@postgres:5432/complyos
      - PORT=3004
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    ports:
      - "3005:3005"
    environment:
      - DATABASE_URL=postgresql://complyos:complyos_dev_password@postgres:5432/complyos
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=3005
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/ai-service:/workspace/project

  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      - AUTH_SERVICE_URL=http://auth-service:3001
      - BUSINESS_SERVICE_URL=http://business-service:3002
      - GST_SERVICE_URL=http://gst-service:3003
      - VENDOR_SERVICE_URL=http://vendor-service:3004
    depends_on:
      - auth-service
      - business-service
      - gst-service
      - vendor-service
    volumes:
      - ./apps/api-gateway:/workspace/project

volumes:
  postgres_data:
  redis_data:
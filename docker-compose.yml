version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: complyos
      POSTGRES_PASSWORD: complyos_dev_password
      POSTGRES_DB: complyos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complyos"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway
  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - ALLOWED_ORIGINS=http://localhost:3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - BUSINESS_SERVICE_URL=http://business-service:3002
      - GST_SERVICE_URL=http://gst-service:3003
      - VENDOR_SERVICE_URL=http://vendor-service:3004
      - CA_SERVICE_URL=http://ca-service:3007
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Auth Service
  auth-service:
    build:
      context: ./apps/auth-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://complyos:complyos_dev_password@postgres:5432/complyos
      - JWT_SECRET=dev-jwt-secret-minimum-32-characters-long
      - JWT_REFRESH_SECRET=dev-refresh-secret-minimum-32-chars
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Business Service
  business-service:
    build:
      context: ./apps/business-service
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DATABASE_URL=postgresql://complyos:complyos_dev_password@postgres:5432/complyos
      - JWT_SECRET=dev-jwt-secret-minimum-32-characters-long
      - AUTH_SERVICE_URL=http://auth-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # GST Service
  gst-service:
    build:
      context: ./apps/gst-service
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - DATABASE_URL=postgresql://complyos:complyos_dev_password@postgres:5432/complyos
      - JWT_SECRET=dev-jwt-secret-minimum-32-characters-long
      - BUSINESS_SERVICE_URL=http://business-service:3002
    depends_on:
      postgres:
        condition: service_healthy
      business-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Vendor Service
  vendor-service:
    build:
      context: ./apps/vendor-service
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - PORT=3004
      - DATABASE_URL=postgresql://complyos:complyos_dev_password@postgres:5432/complyos
      - JWT_SECRET=dev-jwt-secret-minimum-32-characters-long
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AI Service
  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - PORT=3005
      - DATABASE_URL=postgresql://complyos:complyos_dev_password@postgres:5432/complyos
      # Note: Add OPENAI_API_KEY for production
    depends_on:
      postgres:
        condition: service_healthy

  # CA Service
  ca-service:
    build:
      context: ./apps/ca-service
      dockerfile: Dockerfile
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=development
      - PORT=3007
      - DATABASE_URL=postgresql://complyos:complyos_dev_password@postgres:5432/complyos
      - JWT_SECRET=dev-jwt-secret-minimum-32-characters-long
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3007/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Web App (Next.js)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      - api-gateway

volumes:
  postgres_data:

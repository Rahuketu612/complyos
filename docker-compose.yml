version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: complyos
      POSTGRES_PASSWORD: complyos_dev_password
      POSTGRES_DB: complyos
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - "5432:5432"
      - "3000:3000"
      - NODE_ENV=development
      - ALLOWED_ORIGINS=http://localhost:3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - BUSINESS_SERVICE_URL=http://business-service:3002
      - GST_SERVICE_URL=http://gst-service:3003
      - VENDOR_SERVICE_URL=http://vendor-service:3004
      - CA_SERVICE_URL=http://ca-service:3007
      - "3001:3001"
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://complyos:complyos_dev_password@postgres:5432/complyos
      - JWT_SECRET=dev-jwt-secret-minimum-32-characters-long
      - JWT_REFRESH_SECRET=dev-refresh-secret-minimum-32-chars
      - "3002:3002"
      - NODE_ENV=development
      - PORT=3002
      - DATABASE_URL=postgresql://complyos:complyos_dev_password@postgres:5432/complyos
      - JWT_SECRET=dev-jwt-secret-minimum-32-characters-long
      - AUTH_SERVICE_URL=http://auth-service:3001
      - "3003:3003"
      - NODE_ENV=development
      - PORT=3003
      - DATABASE_URL=postgresql://complyos:complyos_dev_password@postgres:5432/complyos
      - JWT_SECRET=dev-jwt-secret-minimum-32-characters-long
      - BUSINESS_SERVICE_URL=http://business-service:3002
      - "3004:3004"
      - NODE_ENV=development
      - PORT=3004
      - DATABASE_URL=postgresql://complyos:complyos_dev_password@postgres:5432/complyos
      - JWT_SECRET=dev-jwt-secret-minimum-32-characters-long
      - "3005:3005"
      - NODE_ENV=development
      - PORT=3005
      - DATABASE_URL=postgresql://complyos:complyos_dev_password@postgres:5432/complyos
      - "3007:3007"
      - NODE_ENV=development
      - PORT=3007
      - DATABASE_URL=postgresql://complyos:complyos_dev_password@postgres:5432/complyos
      - JWT_SECRET=dev-jwt-secret-minimum-32-characters-long
      - "3000:3000"
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - api-gateway
      - "6379:6379"
      - redis-data:/data